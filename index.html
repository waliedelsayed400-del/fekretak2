<script>
(function () {
  function say(extra) {
    var b = document.getElementById('fk-boot');
    if (!b) return;
    b.innerHTML = '<div style="font-size:40px">⚠️</div><div style="font-size:18px;font-weight:bold">الموقع مش قادر يفتح على جهازك</div><div style="margin:10px 0;color:#475569;line-height:1.9">اتأكد من الإنترنت، أو حدّث المتصفح، أو افتح الرابط من Chrome.</div><button style="padding:10px 18px;border:0;border-radius:12px;background:#1e3a8a;color:#fff;font-size:15px" onclick="location.reload()">إعادة المحاولة</button>' + (extra ? '<div dir="ltr" style="margin-top:14px;font-size:11px;color:#94a3b8">' + String(extra).slice(0, 160) + '</div>' : '');
  }
  window.addEventListener('error', function (e) { say(e && e.message); }, true);
  setTimeout(function () { say(''); }, 15000);
})();
</script>
